# ─────────────────────────────────────────────
# TESORERÍA — MOVIMIENTOS CONTABLES
# ─────────────────────────────────────────────

# Crear un movimiento de tesorería (avío o retiro).
# - avío: la Tesorería General envía divisas a la sede → suma al fondo local
# - retiro: la Gerencia Local usa divisas del fondo → resta al fondo
# avioRefId solo se envía si tipo == "retiro" (referencia al avío del que descuenta)
mutation CrearMovimientoTesoreria(
  $tipo: String!,
  $monto: Float!,
  $moneda: String!,
  $tasaBCV: Float!,
  $fechaTasa: Date!,
  $concepto: String!,
  $sedeId: UUID!,
  $creadoPorId: UUID!,
  $avioRefId: UUID
) @auth(level: PUBLIC, insecureReason: "Temporalmente público para desarrollo MVP.") {
  movimientoTesoreria_insert(data: {
    tipo: $tipo
    monto: $monto
    moneda: $moneda
    tasaBCV: $tasaBCV
    fechaTasa: $fechaTasa
    concepto: $concepto
    estado: "pendiente"
    sedeId: $sedeId
    creadoPorId: $creadoPorId
    creadoEn_expr: "request.time"
    avioRefId: $avioRefId
  })
}

# Aprobar un movimiento de tesorería pendiente.
# Solo la Tesorería General puede aprobar avíos.
# Los retiros se consideran aprobados implícitamente por la Gerencia Local al registrarlos,
# pero se puede cambiar estado explícitamente si se requiere flujo de aprobación local.
mutation AprobarMovimientoTesoreria(
  $id: UUID!,
  $aprobadoPorId: UUID!
) @auth(level: PUBLIC, insecureReason: "Temporalmente público para desarrollo MVP.") {
  movimientoTesoreria_update(key: { id: $id }, data: {
    estado: "aprobado"
    aprobadoPorId: $aprobadoPorId
    aprobadoEn_expr: "request.time"
  })
}

# Anular un movimiento de tesorería.
# El registro es inmutable: no se edita ni borra.
# Las correcciones se hacen mediante este asiento de anulación
# que referencia al movimiento original (anulaAId).
mutation AnularMovimientoTesoreria(
  $id: UUID!,
  $anulaAId: UUID!
) @auth(level: PUBLIC, insecureReason: "Temporalmente público para desarrollo MVP.") {
  movimientoTesoreria_update(key: { id: $id }, data: {
    estado: "anulado"
    anulaAId: $anulaAId
  })
}

# Eliminar un movimiento de tesorería.
# Bloqueado con NO_ACCESS para respetar la regla de inmutabilidad del módulo.
# Los movimientos no se eliminan, se anulan vía AnularMovimientoTesoreria.
mutation EliminarMovimientoTesoreria($id: UUID!) @auth(level: NO_ACCESS, insecureReason: "Inmutable por diseño: los movimientos no se eliminan, se anulan.") {
  movimientoTesoreria_delete(key: { id: $id })
}

# ─────────────────────────────────────────────
# TESORERÍA — FONDOS POR SEDE
# ─────────────────────────────────────────────

# Crear un nuevo fondo para una sede.
# Cada sede tiene un solo fondo (relación uno-a-uno).
mutation CrearFondo(
  $sedeId: UUID!,
  $saldo: Float!,
  $moneda: String!
) @auth(level: PUBLIC, insecureReason: "Temporalmente público para desarrollo MVP.") {
  fondo_insert(data: {
    sedeId: $sedeId
    saldo: $saldo
    moneda: $moneda
    ultimaActualizacion_expr: "request.time"
  })
}

# Actualizar el saldo de un fondo existente por ID.
# El saldo se recalcula como Σ avíos aprobados − Σ retiros
# pero se actualiza manualmente aquí para mantener consistencia.
mutation ActualizarFondo(
  $id: UUID!,
  $saldo: Float!,
  $moneda: String!
) @auth(level: PUBLIC, insecureReason: "Temporalmente público para desarrollo MVP.") {
  fondo_update(key: { id: $id }, data: {
    saldo: $saldo
    moneda: $moneda
    ultimaActualizacion_expr: "request.time"
  })
}

# Eliminar un fondo por ID.
# Bloqueado para evitar pérdida accidental de datos de saldo.
mutation EliminarFondo($id: UUID!) @auth(level: NO_ACCESS, insecureReason: "Los fondos no deben eliminarse manualmente.") {
  fondo_delete(key: { id: $id })
}
